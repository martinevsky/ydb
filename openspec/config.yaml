schema: spec-driven

context: |
  YDB C++ actor/tablet monorepo; use C++20 or earlier and write artifacts in English.
  This branch restores YC_IAM_DELEGATION external secrets from RFC 330 and upstream
  draft PRs 55679-55694, including the later independent delegation tablet design.
  The independent tablet owns durable intents, bindings, inventory and revocation
  work; SchemeShard retains schema identity, ACLs and an immutable tablet reference.
  Existing implementation is being hardened. Distinguish implemented/tested behavior
  from pending fixes; never infer passing tests from the presence of test source.
  Current review fixes cover ALTER permissions, token acquisition deadlines and S3
  cancellation across mailboxes. Preserve authenticated DDL and immutable identities.
  Durable storage must not retain authentication bearers, minted tokens or account keys.
  Unknown IAM setup outcomes remain visible; no authoritative replay or lookup contract
  is established for a lost first reply without a saved IAM operation ID.
  Build/tests: ./ya make --build relwithdebinfo -tA <target>; no -j or forced rebuild,
  and no source edits during compilation. Use actual actor/tablet components in
  regressions, controlling external IAM/network responses at their boundaries.
  Repository documentation in ydb/core/tx/iam_delegation/README.md and
  ydb/core/security/iam_delegation_lifecycle/README.md describes the current architecture.

